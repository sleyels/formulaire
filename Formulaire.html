<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Formulaire</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <h1>Formulaire.</h1>
    <p>Remplissez le formulaire s'il vous plait</p>
    <form method="post" action='https://register-demo.freecodecamp.org'>
    
    <!--info de base-->
    <fieldset>
        <label for="first-name">Votre Nom: <input id="first-name" name="first-name" type="text" required /></label>
        <label for="last-name">Votre Prenom: <input id="last-name" name="last-name" type="text" required /></label>
        <label for="email">Votre Email: <input id="email" name="email" type="email" required /></label>
        <label for="new-password">Créer un mot de passe: <input id="new-password" name="new-password" type="password" pattern="[a-z0-5]{8,}" required /></label>
    </fieldset>

    <!--info compte-->
    <fieldset>
        <legend>Type de comtpe (requis)</legend>
        <label for="personal-account"><input id="personal-account" type="radio" name="account-type" class="inline" checked /> Perso</label>
        <label for="business-account"><input id="business-account" type="radio" name="account-type" class="inline" /> Pro</label>
    </fieldset>

    <!--la suite-->
    <fieldset>
        <label for="profile-picture">Recherchez une photo: <input id="profile-picture" type="file" name="file" /></label>
        <label for="age">Input your age (years): <input id="age" type="number" name="age" min="13" max="120" /></label>
        <label for="referrer">Comment avez-vous entendu parlé de nous ?
        <select id="referrer" name="referrer">
            <option value="">(select one)</option>
            <option value="1">freeCodeCamp News</option>
            <option value="2">freeCodeCamp YouTube Channel</option>
            <option value="3">freeCodeCamp Forum</option>
            <option value="4">Other</option>
        </select>
        </label>
        <label for="bio">bio:
        <textarea id="bio" name="bio" rows="3" cols="30" placeholder="T'aime coder..."></textarea>
        </label>
    </fieldset>
    <label for="terms-and-conditions">
        <input class="inline" id="terms-and-conditions" type="checkbox" required name="terms-and-conditions" />J'accepte les  <a href="https://www.freecodecamp.org/news/terms-of-service/">termes et conditions</a>
    </label>
    <input type="submit" value="Soumettre" />
    </form>
</body>
</html>
